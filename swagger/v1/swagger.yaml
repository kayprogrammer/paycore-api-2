---
openapi: 3.0.1
info:
  title: PayCore API
  version: v1
  description: PayCore REST API documentation
servers:
- url: http://localhost:3000
  description: Development
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        is_email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - email
      - is_email_verified
      - created_at
paths:
  "/api/v1/accounts/auth/register":
    post:
      summary: Register a new user
      tags:
      - Auth
      parameters: []
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Registration successful
                  data:
                    type: object
                    properties:
                      user:
                        "$ref": "#/components/schemas/User"
                      token:
                        type: string
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Kay
                email:
                  type: string
                  example: kay@example.com
                password:
                  type: string
                  example: secret123
                password_confirmation:
                  type: string
                  example: secret123
              required:
              - name
              - email
              - password
              - password_confirmation
        required: true
  "/api/v1/accounts/auth/login":
    post:
      summary: Log in an existing user
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: Logged in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        "$ref": "#/components/schemas/User"
                      token:
                        type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Invalid credentials
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: kay@example.com
                password:
                  type: string
                  example: secret123
              required:
              - email
              - password
        required: true
  "/api/v1/accounts/auth/me":
    get:
      summary: Get the current authenticated user
      tags:
      - Auth
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current user returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        "$ref": "#/components/schemas/User"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthorized
